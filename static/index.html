<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>航拍瓦片定位</title>
  <link rel="stylesheet" href="/static/vendor/maplibre-gl.css">
  <style>
    :root {
      --bg: #101614;
      --panel: #18211d;
      --line: #2c3b34;
      --text: #e7f0ea;
      --muted: #8ea497;
      --amber: #e2a322;
      --green: #7dcea0;
      --danger: #e36a5d;
      --ok: #3e9b6e;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 392px;
      grid-template-rows: 42px minmax(0, 1fr);
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .topbar {
      grid-column: 1 / -1;
      grid-row: 1;
      display: flex;
      align-items: center;
      height: 42px;
      padding: 0 14px;
      background: #121a16;
      border-bottom: 1px solid var(--line);
    }
    .menubar { display: flex; align-items: center; gap: 16px; min-width: 0; }
    .brand {
      font-size: 15px;
      font-weight: 650;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .menu-label { color: var(--muted); font-size: 12px; }
    .seg {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }
    .seg button {
      flex: none;
      border-radius: 0;
      padding: 4px 12px;
      background: transparent;
      font-size: 13px;
    }
    .seg button.on { background: var(--amber); color: #1c1404; outline: none; font-weight: 650; }
    .seg button.on:hover { background: #e2a322; }
    #map { grid-column: 1; grid-row: 2; min-height: 0; height: 100%; }
    aside {
      grid-column: 2;
      grid-row: 2;
      min-height: 0;
      border-left: 1px solid var(--line);
      background: var(--panel);
      overflow: auto;
      padding: 18px 18px 32px;
    }
    .lead { color: var(--muted); margin: 0 0 16px; }
    label { display: block; color: var(--muted); font-size: 12px; margin: 12px 0 6px; }
    select, input[type="text"], input[type="file"] {
      width: 100%;
      background: #101614;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
    }
    .row { display: flex; gap: 8px; }
    button {
      flex: 1;
      border: 0;
      border-radius: 6px;
      padding: 9px 10px;
      background: #24312b;
      color: var(--text);
      cursor: pointer;
    }
    button:hover { background: #2d3d35; }
    button.primary { background: var(--amber); color: #1c1404; font-weight: 650; }
    button.on { outline: 2px solid var(--amber); }
    button:disabled { opacity: 0.55; cursor: wait; }
    .bbox, .result, #status {
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 12px;
      white-space: pre-wrap;
      background: #101614;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      min-height: 38px;
    }
    #status.bad { color: var(--danger); }
    #status.good { color: var(--green); }
    #shot {
      display: none;
      width: 100%;
      margin-top: 8px;
      border-radius: 6px;
      cursor: crosshair;
      background: #000;
    }
    .targets { margin-top: 18px; }
    .target-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
    .target-head .title { color: var(--muted); font-size: 12px; letter-spacing: 0.04em; }
    .target-head .count { font: 12px/1 Consolas, "Cascadia Mono", monospace; color: var(--text); }
    .text-btn {
      flex: none;
      margin-left: auto;
      padding: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
    }
    .text-btn:hover { background: transparent; color: var(--danger); }
    .target-frame {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #101614;
      overflow: auto;
    }
    .target-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12px;
    }
    .target-table th,
    .target-table td {
      padding: 6px 6px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
    }
    .target-table th {
      position: sticky;
      top: 0;
      background: #141c18;
      color: var(--muted);
      font-weight: 600;
      font-size: 11px;
    }
    .target-table tbody tr:last-child td { border-bottom: 0; }
    .target-table tbody tr.data { cursor: pointer; }
    .target-table tbody tr.data:hover td { background: #1c2822; }
    .target-table .num { font-family: Consolas, "Cascadia Mono", monospace; color: #d5e4db; }
    .target-table .name-cell { display: flex; align-items: center; gap: 6px; }
    .target-table .name-cell span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .target-table .note { color: #c5d5cc; }
    .target-table tr.empty td {
      padding: 14px 8px;
      color: var(--muted);
      text-align: center;
      cursor: default;
    }
    .target-table button.icon {
      flex: none;
      width: 20px;
      height: 20px;
      padding: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      font-size: 15px;
      line-height: 18px;
    }
    .target-table button.icon:hover { background: #2a2422; color: var(--danger); }
    .pip { flex: none; width: 7px; height: 7px; border-radius: 50%; }
    .pip.center { background: var(--amber); }
    .pip.target { background: var(--danger); }
    #panel-toggle {
      position: fixed;
      z-index: 30;
      top: calc(50vh + 21px);
      right: calc(392px - 14px);
      transform: translateY(-50%);
      display: grid;
      place-items: center;
      width: 16px;
      height: 52px;
      flex: none;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 4px 0 0 4px;
      background: #24312b;
    }
    #panel-toggle:hover { background: #2d3d35; }
    #panel-toggle .tri {
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 6px solid var(--text);
    }
    body.panel-hidden { grid-template-columns: minmax(0, 1fr); }
    body.panel-hidden aside { display: none; }
    body.panel-hidden #panel-toggle { right: 0; }
    body.panel-hidden #panel-toggle .tri {
      border-left: 0;
      border-right: 6px solid var(--text);
    }
    summary { cursor: pointer; color: var(--text); }
    .maplibregl-popup-content {
      background: #17211c;
      color: #e7f0ea;
      border: 1px solid #2c3b34;
      border-radius: 6px;
      padding: 8px 28px 8px 10px;
      box-shadow: none;
      font: 13px/1.45 Consolas, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .maplibregl-popup-close-button { color: #e7f0ea; font-size: 16px; }
    .maplibregl-popup-anchor-top .maplibregl-popup-tip,
    .maplibregl-popup-anchor-top-left .maplibregl-popup-tip,
    .maplibregl-popup-anchor-top-right .maplibregl-popup-tip { border-bottom-color: #17211c; }
    .maplibregl-popup-anchor-bottom .maplibregl-popup-tip,
    .maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip,
    .maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip { border-top-color: #17211c; }
    .maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color: #17211c; }
    .maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color: #17211c; }
    .point-label {
      margin-left: 10px;
      padding: 2px 6px;
      border: 1px solid #2c3b34;
      border-radius: 4px;
      background: rgba(23, 33, 28, 0.92);
      color: #e7f0ea;
      font: 12px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif;
      white-space: nowrap;
      cursor: pointer;
    }
    .attr-form { min-width: 180px; }
    .attr-form .attr-title { font-weight: 650; margin-bottom: 4px; }
    .attr-form label { display: block; margin: 8px 0 0; color: #8ea497; font-size: 12px; }
    .attr-form input, .attr-form textarea {
      width: 100%;
      margin-top: 4px;
      padding: 4px 6px;
      border: 1px solid #2c3b34;
      border-radius: 4px;
      background: #101614;
      color: #e7f0ea;
      font: 13px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .attr-form button { width: 100%; margin-top: 8px; }
    @media (max-width: 900px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: 42px minmax(240px, 58vh) auto;
        overflow: auto;
      }
      #map { grid-column: 1; min-height: 240px; height: 58vh; }
      aside { grid-column: 1; grid-row: 3; border-left: 0; border-top: 1px solid var(--line); }
      #panel-toggle { top: calc(42px + 29vh); right: 10px; }
      body.panel-hidden { grid-template-rows: 42px minmax(0, 1fr); overflow: hidden; }
      body.panel-hidden #map { height: 100%; min-height: 0; }
      body.panel-hidden #panel-toggle { top: auto; bottom: 12px; right: 10px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="menubar" aria-label="主菜单">
      <span class="brand">航拍瓦片定位</span>
      <span class="menu-label">视图</span>
      <div class="seg" role="group" aria-label="视图">
        <button id="view-2d" type="button" class="on" aria-pressed="true">二维</button>
        <button id="view-3d" type="button" aria-pressed="false" title="倾斜查看，按住右键旋转">三维</button>
      </div>
    </nav>
  </header>
  <div id="map"></div>
  <button id="panel-toggle" type="button" aria-expanded="true" aria-label="隐藏信息栏" title="隐藏信息栏"><span class="tri"></span></button>
  <aside>
    <p class="lead">画出任务区，建立搜索底图，上传一张近垂直航拍。单击标绘点查看经纬度，双击可编辑名称和备注。</p>

    <label for="mode">底图来源</label>
    <select id="mode">
      <option value="online">在线卫星</option>
      <option value="cache">已缓存</option>
      <option value="offline">离线包</option>
    </select>

    <div class="row" style="margin-top:12px">
      <button id="draw" type="button">画任务区</button>
      <button id="build" class="primary" type="button">建立搜索底图</button>
    </div>
    <div class="bbox" id="bbox">尚未画矩形</div>
    <div class="row" style="margin-top:8px">
      <button id="clear" type="button">清除标绘</button>
    </div>

    <label for="file">航拍图片</label>
    <input id="file" type="file" accept=".jpg,.jpeg,.png,.tif,.tiff,image/*">
    <div class="row" style="margin-top:10px">
      <button id="go" class="primary" type="button">上传并定位</button>
      <button id="check" type="button">用底图自检</button>
    </div>
    <img id="shot" alt="航拍预览">
    <p class="lead" id="shot-hint" style="display:none">定位成功后，点击照片追加目标点。地图上双击该点可改名称和备注。</p>

    <label>结果</label>
    <div id="status">等待任务区</div>
    <div class="result" id="result"></div>

    <section class="targets">
      <div class="target-head">
        <span class="title">目标列表</span>
        <span class="count" id="target-count">0</span>
        <button id="clear-targets" class="text-btn" type="button">清空</button>
      </div>
      <div class="target-frame">
        <table class="target-table">
          <colgroup>
            <col style="width:24%">
            <col style="width:27%">
            <col style="width:25%">
            <col>
            <col style="width:28px">
          </colgroup>
          <thead>
            <tr>
              <th>名称</th>
              <th>经度</th>
              <th>纬度</th>
              <th>备注</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="target-list"></tbody>
        </table>
      </div>
    </section>

    <details>
      <summary>离线底图与瓦片地址</summary>
      <label for="tile-url">瓦片 URL 模板</label>
      <input id="tile-url" type="text" spellcheck="false">
      <button id="save-url" type="button" style="margin-top:8px;width:100%">保存瓦片地址</button>
      <label for="xyz">本机 XYZ 目录</label>
      <input id="xyz" type="text" placeholder="E:\maps\xyz">
      <button id="use-xyz" type="button" style="margin-top:8px;width:100%">使用该目录</button>
      <label for="pack">上传 MBTiles 或 GeoTIFF</label>
      <input id="pack" type="file" accept=".mbtiles,.tif,.tiff">
      <button id="use-pack" type="button" style="margin-top:8px;width:100%">导入离线包</button>
    </details>
  </aside>
  <script src="/static/vendor/maplibre-gl.js"></script>
  <script>
    const modeEl = document.querySelector("#mode");
    const bboxEl = document.querySelector("#bbox");
    const statusEl = document.querySelector("#status");
    const resultEl = document.querySelector("#result");
    const shot = document.querySelector("#shot");
    let mode = "online";
    let drawMode = false;
    let dragStart = null;
    let aoi = null;
    let jobId = null;
    let localized = false;
    let markFeatures = [];

    function tileTemplate() {
      return `/tiles/{z}/{x}/{y}.png?mode=${encodeURIComponent(mode)}`;
    }

    const map = new maplibregl.Map({
      container: "map",
      style: {
        version: 8,
        sources: {
          sat: {
            type: "raster",
            tiles: [tileTemplate()],
            tileSize: 256,
            attribution: "影像来自当前瓦片源"
          }
        },
        layers: [{ id: "sat", type: "raster", source: "sat" }]
      },
      center: [104.2, 35.6],
      zoom: 3.4,
      pitch: 0,
      maxPitch: 70
    });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-left");
    document.querySelector("#panel-toggle").addEventListener("click", () => {
      const hidden = document.body.classList.toggle("panel-hidden");
      const toggle = document.querySelector("#panel-toggle");
      const label = hidden ? "显示信息栏" : "隐藏信息栏";
      toggle.setAttribute("aria-expanded", String(!hidden));
      toggle.setAttribute("aria-label", label);
      toggle.title = label;
      requestAnimationFrame(() => map.resize());
    });

    function setDimension(is3d) {
      document.querySelector("#view-2d").classList.toggle("on", !is3d);
      document.querySelector("#view-3d").classList.toggle("on", is3d);
      document.querySelector("#view-2d").setAttribute("aria-pressed", String(!is3d));
      document.querySelector("#view-3d").setAttribute("aria-pressed", String(is3d));
      if (is3d) {
        map.dragRotate.enable();
        map.touchZoomRotate.enableRotation();
        const bearing = Math.abs(map.getBearing()) < 1 ? -24 : map.getBearing();
        map.easeTo({ pitch: 62, bearing, duration: 700 });
        return;
      }
      map.easeTo({ pitch: 0, bearing: 0, duration: 700 });
      map.once("moveend", () => {
        if (!document.querySelector("#view-2d").classList.contains("on")) return;
        map.dragRotate.disable();
        map.touchZoomRotate.disableRotation();
      });
    }
    document.querySelector("#view-2d").addEventListener("click", () => setDimension(false));
    document.querySelector("#view-3d").addEventListener("click", () => setDimension(true));

    map.dragRotate.disable();
    map.touchZoomRotate.disableRotation();

    map.on("load", () => {
      map.addSource("aoi", { type: "geojson", data: emptyCollection() });
      map.addLayer({
        id: "aoi-fill",
        type: "fill",
        source: "aoi",
        paint: { "fill-color": "#e2a322", "fill-opacity": 0.12 }
      });
      map.addLayer({
        id: "aoi-line",
        type: "line",
        source: "aoi",
        paint: { "line-color": "#e2a322", "line-width": 2 }
      });
      map.addSource("marks", { type: "geojson", data: emptyCollection() });
      map.addLayer({
        id: "foot",
        type: "line",
        source: "marks",
        filter: ["==", ["get", "kind"], "foot"],
        paint: { "line-color": "#7dcea0", "line-width": 2 }
      });
      map.addLayer({
        id: "center",
        type: "circle",
        source: "marks",
        filter: ["==", ["get", "kind"], "center"],
        paint: {
          "circle-radius": 8,
          "circle-color": "#e2a322",
          "circle-stroke-width": 2,
          "circle-stroke-color": "#1c1404"
        }
      });
      map.addLayer({
        id: "target",
        type: "circle",
        source: "marks",
        filter: ["==", ["get", "kind"], "target"],
        paint: {
          "circle-radius": 8,
          "circle-color": "#e36a5d",
          "circle-stroke-width": 2,
          "circle-stroke-color": "#fff4f2"
        }
      });
      for (const layerId of ["center", "target"]) {
        map.on("click", layerId, (event) => {
          if (drawMode || !event.features || !event.features.length) return;
          openPointPopup(event.lngLat, event.features[0].properties.id);
        });
        map.on("mouseenter", layerId, () => {
          if (!drawMode) map.getCanvas().style.cursor = "pointer";
        });
        map.on("mouseleave", layerId, () => {
          map.getCanvas().style.cursor = drawMode ? "crosshair" : "";
        });
      }
      map.on("dblclick", (event) => {
        if (drawMode) return;
        const hits = map.queryRenderedFeatures(event.point, { layers: ["center", "target"] });
        if (!hits.length) return;
        event.preventDefault();
        openEditPopup(event.lngLat, hits[0].properties.id);
      });
      loadTargets();
    });

    let pointPopup = null;
    let markSeq = 0;
    let targetCount = 0;
    const labelMarkers = [];

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[ch]));
    }

    function featureById(id) {
      return markFeatures.find((feature) => feature.properties.id === id);
    }

    function openPointPopup(lngLat, id) {
      const feature = featureById(id);
      if (!feature) return;
      const props = feature.properties;
      if (pointPopup) pointPopup.remove();
      const note = props.note ? `<div>${escapeHtml(props.note)}</div>` : "";
      pointPopup = new maplibregl.Popup({ closeButton: true, maxWidth: "260px" })
        .setLngLat(lngLat)
        .setHTML(
          `<strong>${escapeHtml(props.name)}</strong>` +
          `<div>经度 ${Number(props.lon).toFixed(6)}</div>` +
          `<div>纬度 ${Number(props.lat).toFixed(6)}</div>` +
          note +
          `<div style="color:#8ea497;margin-top:4px">双击可编辑文字</div>`
        )
        .addTo(map);
    }

    function openEditPopup(lngLat, id) {
      const feature = featureById(id);
      if (!feature) return;
      const props = feature.properties;
      if (pointPopup) pointPopup.remove();
      pointPopup = new maplibregl.Popup({ closeButton: true, closeOnClick: false, maxWidth: "280px" })
        .setLngLat(lngLat)
        .setHTML(
          `<form class="attr-form">` +
          `<div class="attr-title">文字属性</div>` +
          `<label>名称<input name="name" maxlength="40" value="${escapeHtml(props.name)}"></label>` +
          `<label>备注<textarea name="note" maxlength="200" rows="3">${escapeHtml(props.note || "")}</textarea></label>` +
          `<button type="submit">保存</button>` +
          `</form>`
        )
        .addTo(map);
      const form = pointPopup.getElement().querySelector("form");
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const name = form.querySelector('input[name="name"]').value.trim();
        feature.properties.name = name || props.name;
        feature.properties.note = form.querySelector('textarea[name="note"]').value.trim();
        publishMarks();
        saveTarget(feature.properties);
        openPointPopup(lngLat, id);
        setStatus(`已保存「${feature.properties.name}」的文字属性`, "good");
      });
    }

    function closePointPopup() {
      if (!pointPopup) return;
      pointPopup.remove();
      pointPopup = null;
    }

    function emptyCollection() {
      return { type: "FeatureCollection", features: [] };
    }

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = kind || "";
    }

    function ring(box) {
      return [
        [box.west, box.north],
        [box.east, box.north],
        [box.east, box.south],
        [box.west, box.south],
        [box.west, box.north]
      ];
    }

    function showAoi(box) {
      if (!map.getSource("aoi")) return;
      map.getSource("aoi").setData({
        type: "Feature",
        geometry: { type: "Polygon", coordinates: [ring(box)] },
        properties: {}
      });
      bboxEl.textContent = `W ${box.west.toFixed(5)}\nS ${box.south.toFixed(5)}\nE ${box.east.toFixed(5)}\nN ${box.north.toFixed(5)}`;
    }

    function boundsOf(a, b) {
      return {
        west: Math.min(a.lng, b.lng),
        east: Math.max(a.lng, b.lng),
        south: Math.min(a.lat, b.lat),
        north: Math.max(a.lat, b.lat)
      };
    }

    document.querySelector("#draw").addEventListener("click", () => {
      drawMode = !drawMode;
      document.querySelector("#draw").classList.toggle("on", drawMode);
      map.getCanvas().style.cursor = drawMode ? "crosshair" : "";
      if (drawMode) map.dragPan.disable();
      else map.dragPan.enable();
    });

    map.on("mousedown", (event) => {
      if (!drawMode) return;
      dragStart = event.lngLat;
      map.dragPan.disable();
    });
    map.on("mousemove", (event) => {
      if (!dragStart) return;
      aoi = boundsOf(dragStart, event.lngLat);
      showAoi(aoi);
    });
    window.addEventListener("mouseup", (event) => {
      if (!dragStart) return;
      dragStart = null;
      if (aoi && Math.abs(aoi.east - aoi.west) < 0.0002) {
        setStatus("矩形太小，请重新画任务区", "bad");
      }
    });

    modeEl.addEventListener("change", () => {
      mode = modeEl.value;
      const source = map.getSource("sat");
      if (source && source.setTiles) source.setTiles([tileTemplate()]);
    });

    function busy(on) {
      for (const id of ["build", "go", "check", "draw", "clear"]) {
        document.querySelector("#" + id).disabled = on;
      }
    }

    async function readError(response) {
      try {
        const data = await response.json();
        return data.detail || response.statusText;
      } catch (_err) {
        return response.statusText;
      }
    }

    document.querySelector("#build").addEventListener("click", async () => {
      if (!aoi) {
        setStatus("请先画任务区", "bad");
        return;
      }
      busy(true);
      setStatus("正在读取瓦片并拼接搜索底图…");
      clearMarks();
      localized = false;
      try {
        const response = await fetch("/api/aoi", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...aoi, source: mode })
        });
        if (!response.ok) throw new Error(await readError(response));
        const data = await response.json();
        jobId = data.job_id;
        setStatus(`底图已建立。zoom ${data.zoom}，${data.width}×${data.height}，地面分辨率 ${data.gsd_m} 米/像素`, "good");
        resultEl.textContent = `瓦片 ${data.tile_count} 张`;
      } catch (err) {
        setStatus(err.message, "bad");
      } finally {
        busy(false);
      }
    });

    function publishMarks() {
      const source = map.getSource("marks");
      if (source) source.setData({ type: "FeatureCollection", features: markFeatures });
      refreshLabels();
    }

    function refreshLabels() {
      while (labelMarkers.length) labelMarkers.pop().remove();
      for (const feature of markFeatures) {
        if (feature.geometry.type !== "Point") continue;
        const props = feature.properties;
        const element = document.createElement("div");
        element.className = "point-label";
        element.textContent = props.name || "";
        element.title = "双击编辑文字";
        element.addEventListener("dblclick", (event) => {
          event.preventDefault();
          event.stopPropagation();
          openEditPopup(feature.geometry.coordinates, props.id);
        });
        element.addEventListener("click", (event) => {
          event.stopPropagation();
          openPointPopup(feature.geometry.coordinates, props.id);
        });
        const marker = new maplibregl.Marker({ element: element, anchor: "left" })
          .setLngLat(feature.geometry.coordinates)
          .addTo(map);
        labelMarkers.push(marker);
      }
    }

    function clearMarks() {
      markFeatures = [];
      targetCount = 0;
      publishMarks();
      closePointPopup();
    }

    function addMark(kind, lon, lat, geometry, saved) {
      const properties = {
        kind: kind,
        id: "m" + (++markSeq),
        targetId: saved ? saved.id : crypto.randomUUID(),
        name: saved ? saved.name : "",
        note: saved ? (saved.note || "") : ""
      };
      if (!saved && kind === "center") properties.name = "图像中心";
      if (!saved && kind === "target") {
        targetCount += 1;
        properties.name = targetCount === 1 ? "目标点" : "目标点 " + targetCount;
      }
      if (lon != null && lat != null) {
        properties.lon = lon;
        properties.lat = lat;
      }
      markFeatures.push({
        type: "Feature",
        properties: properties,
        geometry: geometry || { type: "Point", coordinates: [lon, lat] }
      });
      publishMarks();
      if (!saved && (kind === "center" || kind === "target")) saveTarget(properties);
      return markFeatures[markFeatures.length - 1];
    }

    let savedTargets = [];

    function ensureMark(item) {
      const existing = markFeatures.find((feature) => feature.properties.targetId === item.id);
      if (existing) {
        existing.properties.name = item.name;
        existing.properties.note = item.note || "";
        existing.properties.lon = item.lon;
        existing.properties.lat = item.lat;
        existing.geometry.coordinates = [item.lon, item.lat];
        publishMarks();
        return existing;
      }
      return addMark(item.kind || "target", item.lon, item.lat, null, item);
    }

    async function loadTargets() {
      const response = await fetch("/api/targets");
      if (!response.ok) return;
      savedTargets = await response.json();
      renderTargetList();
      for (const item of savedTargets) ensureMark(item);
    }

    async function saveTarget(props) {
      const response = await fetch("/api/targets", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          id: props.targetId,
          name: props.name,
          note: props.note || "",
          lon: props.lon,
          lat: props.lat,
          kind: props.kind
        })
      });
      if (!response.ok) {
        setStatus(await readError(response), "bad");
        return;
      }
      const saved = await response.json();
      const index = savedTargets.findIndex((item) => item.id === saved.id);
      if (index >= 0) savedTargets[index] = saved;
      else savedTargets.unshift(saved);
      renderTargetList();
    }

    function renderTargetList() {
      const list = document.querySelector("#target-list");
      list.replaceChildren();
      document.querySelector("#target-count").textContent = String(savedTargets.length);
      if (!savedTargets.length) {
        const empty = document.createElement("tr");
        empty.className = "empty";
        empty.innerHTML = `<td colspan="5">还没有定位目标。双击一行可回到地图。</td>`;
        list.appendChild(empty);
        return;
      }
      for (const item of savedTargets) {
        const row = document.createElement("tr");
        const kind = item.kind === "center" ? "center" : "target";
        row.className = "data";
        row.title = "双击回到地图上的这个点";
        row.innerHTML =
          `<td><span class="name-cell"><span class="pip ${kind}"></span><span></span></span></td>` +
          `<td class="num"></td><td class="num"></td><td class="note"></td>` +
          `<td><button type="button" class="icon" title="删除" aria-label="删除">×</button></td>`;
        row.querySelector(".name-cell span:last-child").textContent = item.name;
        const nums = row.querySelectorAll(".num");
        nums[0].textContent = Number(item.lon).toFixed(6);
        nums[1].textContent = Number(item.lat).toFixed(6);
        row.querySelector(".note").textContent = item.note || "";
        row.addEventListener("dblclick", (event) => {
          if (event.target.closest("button")) return;
          focusTarget(item.id);
        });
        row.querySelector("button").addEventListener("click", (event) => {
          event.stopPropagation();
          removeSavedTarget(item.id);
        });
        list.appendChild(row);
      }
    }

    function focusTarget(id) {
      const item = savedTargets.find((row) => row.id === id);
      if (!item) return;
      const feature = ensureMark(item);
      map.flyTo({ center: [item.lon, item.lat], zoom: Math.max(map.getZoom(), 15) });
      openPointPopup([item.lon, item.lat], feature.properties.id);
    }

    async function removeSavedTarget(id) {
      const response = await fetch("/api/targets/" + id, { method: "DELETE" });
      if (!response.ok) {
        setStatus(await readError(response), "bad");
        return;
      }
      savedTargets = savedTargets.filter((item) => item.id !== id);
      markFeatures = markFeatures.filter((feature) => feature.properties.targetId !== id);
      publishMarks();
      closePointPopup();
      renderTargetList();
    }

    document.querySelector("#clear-targets").addEventListener("click", async () => {
      const response = await fetch("/api/targets/clear", { method: "POST" });
      if (!response.ok) {
        setStatus(await readError(response), "bad");
        return;
      }
      const ids = new Set(savedTargets.map((item) => item.id));
      savedTargets = [];
      markFeatures = markFeatures.filter((feature) => !ids.has(feature.properties.targetId));
      publishMarks();
      closePointPopup();
      renderTargetList();
      setStatus("目标列表已清空");
    });

    function clearPlot() {
      closePointPopup();
      aoi = null;
      dragStart = null;
      drawMode = false;
      localized = false;
      jobId = null;
      document.querySelector("#draw").classList.remove("on");
      map.dragPan.enable();
      map.getCanvas().style.cursor = "";
      const aoiSource = map.getSource("aoi");
      if (aoiSource) aoiSource.setData(emptyCollection());
      bboxEl.textContent = "尚未画矩形";
      clearMarks();
      resultEl.textContent = "";
      shot.removeAttribute("src");
      shot.style.display = "none";
      document.querySelector("#shot-hint").style.display = "none";
      document.querySelector("#file").value = "";
      setStatus("已清除任务区和当前标绘。目标列表仍保留，双击列表可回到该位置。");
    }

    document.querySelector("#clear").addEventListener("click", clearPlot);

    function formatResult(data) {
      if (!data.ok) return data.reason || "定位失败";
      const c = data.center;
      const lines = [
        `中心 ${c.lon.toFixed(6)}, ${c.lat.toFixed(6)}`,
        `内点 ${data.inliers}，重投影 ${data.reproj_error_px.toFixed(2)} px`,
        `置信度 ${(data.confidence * 100).toFixed(0)}%`
      ];
      data.footprint.forEach((p, i) => {
        lines.push(`角${i + 1} ${p.lon.toFixed(6)}, ${p.lat.toFixed(6)}`);
      });
      return lines.join("\n");
    }

    document.querySelector("#go").addEventListener("click", async () => {
      if (!jobId) {
        setStatus("请先建立搜索底图", "bad");
        return;
      }
      const file = document.querySelector("#file").files[0];
      if (!file) {
        setStatus("请选择航拍图片", "bad");
        return;
      }
      busy(true);
      setStatus("正在匹配…");
      clearMarks();
      localized = false;
      shot.src = URL.createObjectURL(file);
      shot.style.display = "block";
      document.querySelector("#shot-hint").style.display = "block";
      try {
        const body = new FormData();
        body.append("job_id", jobId);
        body.append("file", file);
        const response = await fetch("/api/localize", { method: "POST", body });
        if (!response.ok) throw new Error(await readError(response));
        const data = await response.json();
        resultEl.textContent = formatResult(data);
        if (!data.ok) {
          localized = false;
          setStatus(data.reason || "置信度不足，未放置确定点", "bad");
          return;
        }
        localized = true;
        const ringCoords = data.footprint.map((p) => [p.lon, p.lat]);
        ringCoords.push(ringCoords[0]);
        addMark("foot", null, null, { type: "LineString", coordinates: ringCoords });
        addMark("center", data.center.lon, data.center.lat);
        map.flyTo({ center: [data.center.lon, data.center.lat], zoom: Math.max(map.getZoom(), 15) });
        setStatus("已标出图像中心。单击查看经纬度，双击编辑名称和备注。", "good");
      } catch (err) {
        setStatus(err.message, "bad");
      } finally {
        busy(false);
      }
    });

    shot.addEventListener("click", async (event) => {
      if (!localized || !jobId) return;
      const rect = shot.getBoundingClientRect();
      const x = (event.clientX - rect.left) * shot.naturalWidth / rect.width;
      const y = (event.clientY - rect.top) * shot.naturalHeight / rect.height;
      try {
        const response = await fetch("/api/point", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ job_id: jobId, x, y })
        });
        if (!response.ok) throw new Error(await readError(response));
        const data = await response.json();
        addMark("target", data.lon, data.lat);
        const extra = `\n目标点 ${data.lon.toFixed(6)}, ${data.lat.toFixed(6)}`;
        if (!resultEl.textContent.includes(extra.trim())) resultEl.textContent += extra;
      } catch (err) {
        setStatus(err.message, "bad");
      }
    });

    document.querySelector("#check").addEventListener("click", async () => {
      if (!jobId) {
        setStatus("请先建立搜索底图", "bad");
        return;
      }
      busy(true);
      setStatus("正在用镶嵌图裁块自检，可能需要一会儿…");
      try {
        const response = await fetch("/api/self-check", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ job_id: jobId })
        });
        if (!response.ok) throw new Error(await readError(response));
        const data = await response.json();
        const straight = data.straight_error_px == null ? data.straight_reason : data.straight_error_px.toFixed(2) + " px";
        const rotated = data.rotated_error_px == null ? data.rotated_reason : data.rotated_error_px.toFixed(2) + " px";
        resultEl.textContent = `正放误差 ${straight}\n旋转 90° 误差 ${rotated}\n无关图已拒绝 ${data.unrelated_rejected ? "是" : "否"} ${data.unrelated_reason}`;
        setStatus(data.ok ? "自检通过" : "自检未通过", data.ok ? "good" : "bad");
      } catch (err) {
        setStatus(err.message, "bad");
      } finally {
        busy(false);
      }
    });

    async function loadSettings() {
      const response = await fetch("/api/settings");
      if (!response.ok) return;
      const data = await response.json();
      document.querySelector("#tile-url").value = data.tile_url || "";
      if (data.offline && data.offline.kind === "xyz") {
        document.querySelector("#xyz").value = data.offline.path || "";
      }
    }
    loadSettings();

    document.querySelector("#save-url").addEventListener("click", async () => {
      const tile_url = document.querySelector("#tile-url").value.trim();
      const response = await fetch("/api/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tile_url })
      });
      setStatus(response.ok ? "瓦片地址已保存" : await readError(response), response.ok ? "good" : "bad");
    });

    document.querySelector("#use-xyz").addEventListener("click", async () => {
      const body = new FormData();
      body.append("xyz_dir", document.querySelector("#xyz").value.trim());
      const response = await fetch("/api/offline", { method: "POST", body });
      if (!response.ok) {
        setStatus(await readError(response), "bad");
        return;
      }
      mode = "offline";
      modeEl.value = "offline";
      map.getSource("sat").setTiles([tileTemplate()]);
      setStatus("已切换到 XYZ 离线目录", "good");
    });

    document.querySelector("#use-pack").addEventListener("click", async () => {
      const file = document.querySelector("#pack").files[0];
      if (!file) {
        setStatus("请选择 MBTiles 或 GeoTIFF", "bad");
        return;
      }
      const body = new FormData();
      body.append("file", file);
      setStatus("正在导入离线包…");
      const response = await fetch("/api/offline", { method: "POST", body });
      if (!response.ok) {
        setStatus(await readError(response), "bad");
        return;
      }
      mode = "offline";
      modeEl.value = "offline";
      map.getSource("sat").setTiles([tileTemplate()]);
      setStatus("离线包已导入", "good");
    });
  </script>
</body>
</html>
